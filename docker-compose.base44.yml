services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:80"
    volumes:
      - ./:/var/www/html/ricco-web/ricco
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
